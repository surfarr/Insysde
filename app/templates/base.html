<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if refresh %}<meta http-equiv="refresh" content="{{ refresh }}">{% endif %}
  <title>{% block title %}Campus Dashboard{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <h1>Campus Dashboard – Universität Liechtenstein, Vaduz</h1>
    <nav>
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('weather_page') }}">Weather</a>
      <a href="{{ url_for('buses_page') }}">Buses</a>
      <a href="{{ url_for('flights_page') }}">Flights</a>
      <a href="{{ url_for('about') }}">About</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
